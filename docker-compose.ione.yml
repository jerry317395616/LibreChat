name: ione-librechat

services:
  api:
    image: ione/librechat:${LIBRECHAT_IMAGE_TAG:-local}
    build:
      context: .
      target: node
    container_name: ione-librechat
    restart: unless-stopped
    env_file:
      - .env.ione
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      CONFIG_PATH: /app/librechat.yaml
      NO_PROXY: localhost,127.0.0.1,mongodb,meilisearch,host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 10.144.133.1:3080:3080
    volumes:
      - ./.env.ione:/app/.env:ro
      - ./librechat.ione.yaml:/app/librechat.yaml:ro
      - ./runtime/images:/app/client/public/images
      - ./runtime/uploads:/app/uploads
      - ./runtime/logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    mem_limit: 2g
    cpus: 4
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  mongodb:
    image: mongo:8.0.20
    container_name: ione-librechat-mongodb
    restart: unless-stopped
    command: mongod --noauth --wiredTigerCacheSizeGB 0.25
    volumes:
      - ./runtime/mongodb:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 768m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: ione-librechat-meilisearch
    restart: unless-stopped
    env_file:
      - .env.ione
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./runtime/meilisearch:/meili_data
    healthcheck:
      test: [CMD, wget, --no-verbose, --spider, http://127.0.0.1:7700/health]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 512m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
